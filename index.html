<!-- ---------------------------------------------- -->
<!-- El header sirve para presentar algo como una "sección principal de la página", -->
<!-- en este caso será para la bienvenida. -->
<!-- El class = text-center py-5 centra todo el texto y agrega un padding vertical para que -->
<!-- no esté pegado arriba. -->

<header class="text-center py-5">

<!-- ---------------------------------------------- -->
<!-- h1 para el título principal de la página.-->
<!-- Display-4 es una clase de bootstrap que hará el texto grande y llamativo.-->
<!-- el fw-bold hará que la fuente esté en negrita.-->
<!-- el p solamente es un párrafo, mientras el class=lead es una clase de bootstrap que -->
<!-- hace el texto más ideal para subtítulos.-->
<!-- los a llevarán a distintas funciones correspondientes a sus nombres.-->

<h1 class = "display-4 fw-bold">Bienvenido a SIN PICARSE</h1>
<p class="lead">Tienda de juegos de mesa para jugar SIN PICARSE.</p>
<a href="login.html" class="btn btn-danger btn-lg">Iniciar Sesión</a>
<!-- <a href="registro.html" class="btn btn-danger btn-lg">Registrarse</a> -->
</header>


<!-- ---------------------------------------------- -->
<!-- //el class container my-5 es un contenedor bootstrap con margen vertical -->
<!-- //h2 como subtítulo para la sección de productos destacados.-->
<!-- //el class=row e id=preview-productos es para insertar las cards de productos destacados -->
<!-- //usando js. El id es lo que usaremos en index.js para mostrar productos.-->

<div class="container my-5">
    <h2 class="text-center mb-4">Productos destacados</h2>
    <div class="row" id="preview-productos">

    </div>
</div>


<!-- ---------------------------------------------- -->
<!-- //footer es para un pie de página-->
<!-- //bg-danger es para el fondo rojo, bootstrap.-->
<!-- //text-center py-3 texto centrado y padding vertical nuevamente.-->
<!-- //class=mb-0 es para un párrafo sin margen inferior.-->

<footer class="bg-danger text-center py-3">
    <p class="mb-0">SIN PICARSE © 2026 - Todos los derechos reservados</p>
</footer>


<!-- ---------------------------------------------- -->
 <!-- Aquí importamos el archivo js de productos y el de index.js -->

<script src="js/index.js"></script>
<script src="js/login.js"></script>
<script src="js/cerrarSesion.js"></script>

</body>
